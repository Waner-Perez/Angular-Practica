<section class="mx-5">
    <div class="aura aura-glow w-full max-w-8xl">
        <div class="card bg-base-100 w-full">
            <div class="card-body">
                <div class="divider divider-accent mb-10">
                    <h1 class="text-3xl">{{countryDetail().name}} </h1>
                </div>

                <figure class="diff h-175" tabindex="0">
                    <div class="diff-item-1 bg-linear-to-t from-violet-500 to-fuchsia-500" role="img" tabindex="0">
                        <img 
                            class="h-175 w-auto object-contain" 
                            [src]="countryDetail().flagSvg"
                            [alt]="countryDetail().name" 
                        />
                    </div>
                    <div class="diff-item-2" role="img">
                        <div>
                            <img 
                                [src]="countryDetail().flagSvg" 
                                [alt]="countryDetail().name"
                                class="absolute inset-0 w-full h-full object-cover opacity-20" 
                            />
                            
                            <div class="h-full overflow-y-auto scrollbar-thin pointer-events-auto">
                                <div class="grid grid-cols-1 lg:grid-cols-2 xl:grid-cols-3 xl:grid-flow-row xl:grid-rows-4 gap-5 p-5 sm:p-10">
                                    @for(item of infoItems(); track item.label){
                                        <app-country-info-items 
                                            [label]="item.label"
                                            [value]="item.value ?? ''"
                                            [format]="item.format"
                                            [unit]="item.unit"
                                            [list]="item.list"
                                            [class]="
                                                item.label === 'Lenguajes' ? 'lg:col-span-2 xl:col-span-3 lg:order-8' : 
                                                item.label === 'Fronteras' ? 'xl:col-span-2 lg:order-7' : 
                                                ''
                                            "
                                        />
                                    }
                                </div>
                            </div>
                        </div>
                    </div>
                    <div class="diff-resizer"></div>
                </figure>
            </div>
        </div>
    </div>
</section>
