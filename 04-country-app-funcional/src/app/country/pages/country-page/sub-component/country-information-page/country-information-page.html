<section class="mx-5">
    <div class="aura aura-glow w-full max-w-8xl">
        <div class="card bg-base-100 w-full">
            <div class="card-body">
                <div class="divider divider-accent mb-10">
                    <h1 class="text-3xl">{{countryDetail().name}} </h1>
                </div>

                <figure class="diff h-175" tabindex="0">
                    <div class="diff-item-1 bg-linear-to-t from-violet-500 to-fuchsia-500" role="img" tabindex="0">
                        <img class="h-175 w-auto object-contain" [src]="countryDetail().flagSvg"
                            [alt]="countryDetail().name" />
                    </div>
                    <div class="diff-item-2" role="img">
                        <!-- <div class="bg-base-200 grid place-content-center text-9xl font-black">DAISY</div> -->

                        <div>
                            <img [src]="countryDetail().flagSvg" [alt]="countryDetail().name"
                                class="absolute inset-0 w-full h-full object-cover opacity-20" />

                            <div class="grid grid-cols-3 grid-flow-row grid-rows-4 gap-5 p-10  overflow-y-auto">
                                @for(item of infoItems(); track item.label){
                                    <app-country-info-items 
                                        [label]="item.label"
                                        [value]="item.value ?? ''"
                                        [format]="item.format"
                                        [unit]="item.unit"
                                        [list]="item.list"
                                        [class]="
                                            item.label === 'Fronteras' ? 'col-span-2 order-7' : 
                                            item.label === 'Lenguajes' ? 'col-span-3 order-8' : 
                                            ''
                                        "
                                    />
                                }
                            </div>
                        </div>

                    </div>
                    <div class="diff-resizer"></div>
                </figure>
            </div>
        </div>
    </div>
</section>
